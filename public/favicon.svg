<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="190" stroke="white" stroke-opacity="0.12" stroke-width="8" fill="none"/>
  
  <!-- Checkmark / Habit Loop -->
  <path d="M150 260 L220 330 L360 180" stroke="white" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Growth Spark / Partner Dots -->
  <circle cx="360" cy="150" r="26" fill="#38bdf8" />
  <circle cx="150" cy="360" r="18" fill="#10b981" />
  <circle cx="380" cy="340" r="22" fill="#fbbf24" />
</svg>